[project]
name = "banna"
version = "0.1.0"
description = "کوپایلوت هوشمند برنامه‌ریزی و اجرای بازسازی — Scope & Estimate Copilot"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
banna-brief = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.models", "app.engines", "app.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
